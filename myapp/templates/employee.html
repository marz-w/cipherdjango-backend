<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 40px 15px;
        }

        .container {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px #0001;
        }

        h1 {
            text-align: center;
            color: #1e293b;
            margin: 0 0 8px;
        }

        .intro {
            text-align: center;
            color: #64748b;
            margin: 0 0 24px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .field.full-width {
            grid-column: 1 / -1;
        }

        label {
            color: #334155;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font: inherit;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px #2563eb20;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            margin-bottom: 12px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
        }

        .message.error {
            color: #b91c1c;
            background: #fee2e2;
            border: 1px solid #fecaca;
        }

        .message.success {
            color: #15803d;
            background: #dcfce7;
            border: 1px solid #bbf7d0;
        }

        @media (max-width: 480px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .field.full-width {
                grid-column: auto;
            }

            .container {
                padding: 24px 20px;
            }
        }
    </style>
</head>

<body>
<main class="container">
    <h1>Add Employee</h1>
    <p class="intro">Enter the employee's details below.</p>

    {% for message in messages %}
        <div class="message {{ message.tags }}">{{ message }}</div>
    {% endfor %}

    <form method="POST">
        {% csrf_token %}

        <div class="form-grid">
            <div class="field">
                <label for="first_name">First name</label>
                <input type="text"
                       id="first_name"
                       name="first_name"
                       maxlength="50"
                       autocomplete="given-name"
                       required>
            </div>

            <div class="field">
                <label for="last_name">Last name</label>
                <input type="text"
                       id="last_name"
                       name="last_name"
                       maxlength="50"
                       autocomplete="family-name"
                       required>
            </div>

            <div class="field full-width">
                <label for="email">Email address</label>
                <input type="email"
                       id="email"
                       name="email"
                       autocomplete="email"
                       required>
            </div>

            <div class="field">
                <label for="phone_number">Phone number <span>(optional)</span></label>
                <input type="tel"
                       id="phone_number"
                       name="phone_number"
                       maxlength="15"
                       autocomplete="tel">
            </div>

            <div class="field">
                <label for="hire_date">Hire date</label>
                <input type="date"
                       id="hire_date"
                       name="hire_date"
                       required>
            </div>

            <div class="field">
                <label for="job_title">Job title</label>
                <input type="text"
                       id="job_title"
                       name="job_title"
                       maxlength="100"
                       required>
            </div>

            <div class="field">
                <label for="salary">Salary</label>
                <input type="number"
                       id="salary"
                       name="salary"
                       min="0"
                       step="0.01"
                       required>
            </div>
        </div>

        <button type="submit">Save Employee</button>
    </form>
</main>
</body>
</html>
